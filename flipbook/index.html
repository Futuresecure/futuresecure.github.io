<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP Health Insurance Flipbook</title><style>body{margin:0;background:#edf3f3;color:#143f43;font:16px system-ui}header{background:#143f43;color:white;padding:18px;text-align:center}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:white;padding:12px}button,a{padding:10px;border:1px solid #abc;border-radius:8px;background:white;color:#143f43;text-decoration:none;cursor:pointer}button:disabled{opacity:.4}#status{text-align:center;padding:12px}#book{margin:12px auto}.page{background:white;overflow:hidden}.page canvas{width:100%;height:100%;object-fit:contain}footer{text-align:center;padding:20px}input{width:55px;padding:8px}</style></head><body><header><strong>FUTURE SECURE PROVIDERS</strong><div>ஹெல்த் இன்சூரன்ஸ் புரிஞ்சுக்கலாம் · Digital Flipbook</div></header><nav><button id="prev">❮ Previous</button><label>Page <input id="page" type="number" value="1" min="1"> / <span id="total">—</span></label><button id="next">Next ❯</button><button id="zi">Zoom +</button><button id="zo">Zoom −</button><button id="full">Full Screen</button><button id="share">Share</button><a href="brochure.pdf" download>Download PDF</a></nav><div id="status">Loading book…</div><main id="book"></main><footer>Future Secure Providers : Call 9585 905 905, 9363 705 905.</footer><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>const $=id=>document.getElementById(id);let pdf,flip,zoom=1,renderToken=0;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';async function load(){try{pdf=await pdfjsLib.getDocument('brochure.pdf').promise;$('total').textContent=pdf.numPages;await draw()}catch(e){$('status').textContent='PDF upload தேவை: flipbook/brochure.pdf ('+e.message+')'}}async function draw(){const token=++renderToken,old=flip?.getCurrentPageIndex()||0;if(flip){flip.destroy();flip=null}const el=$('book');el.replaceChildren();const p=await pdf.getPage(1),v=p.getViewport({scale:1}),w=Math.max(180,Math.min(480,innerWidth>720?(innerWidth-80)/2:innerWidth-25)),h=w*v.height/v.width;for(let i=1;i<=pdf.numPages;i++){const div=document.createElement('div');div.className='page';const canvas=document.createElement('canvas');div.append(canvas);el.append(div)}flip=new St.PageFlip(el,{width:w,height:h,size:'fixed',showCover:true,mobileScrollSupport:false,maxShadowOpacity:.25});flip.loadFromHTML(el.querySelectorAll('.page'));const canvases=el.querySelectorAll('canvas'),rendered=new Set(),pending=new Set();async function renderPage(i){if(token!==renderToken||i<0||i>=pdf.numPages||rendered.has(i)||pending.has(i))return;pending.add(i);try{const page=await pdf.getPage(i+1);if(token!==renderToken)return;const vp=page.getViewport({scale:Math.min(1.5,devicePixelRatio||1)*w*zoom/v.width}),canvas=canvases[i];canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;rendered.add(i)}catch(e){console.warn(e)}finally{pending.delete(i)}}async function around(i){if(token!==renderToken)return;$('page').value=i+1;$('prev').disabled=i===0;$('next').disabled=i===pdf.numPages-1;$('status').textContent='Page '+(i+1)+' / '+pdf.numPages;await Promise.all([i-2,i-1,i,i+1,i+2,i+3].map(renderPage))}flip.on('flip',e=>around(e.data));flip.flip(Math.min(old,pdf.numPages-1));await around(old)}$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();$('page').onchange=()=>flip?.flip(Math.max(0,Math.min(pdf.numPages-1,Number($('page').value)-1)));$('zi').onclick=()=>{zoom=Math.min(2,zoom+.25);draw()};$('zo').onclick=()=>{zoom=Math.max(1,zoom-.25);draw()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('share').onclick=async()=>{if(navigator.share)await navigator.share({url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);else prompt('Share:',location.href)};let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf)draw()},400)});load();</script></body></html>
