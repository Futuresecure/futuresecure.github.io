book…</div><main id="book"></main><footer>Future Secure Providers : Call 9585 905 905, 9363 705 905.</footer><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
const $=id=>document.getElementById(id);
let pdf,flip,zoom=1,epoch=0,rendered=new Map(),queue=[],working=false,current=0;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function load(){try{pdf=await pdfjsLib.getDocument({url:'brochure.pdf',disableAutoFetch:true,disableStream:true}).promise;$('total').textContent=pdf.numPages;await build(0)}catch(e){$('status').textContent='Unable to open PDF: '+e.message}}
async function build(target){const id=++epoch;queue=[];rendered.clear();const root=$('book');if(flip){flip.destroy();flip=null}root.replaceChildren();const first=await pdf.getPage(1);if(id!==epoch)return;const size=first.getViewport({scale:1}),w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22)),h=w*size.height/size.width;
const frag=document.createDocumentFragment();for(let i=0;i<pdf.numPages;i++){const div=document.createElement('div');div.className='page';div.dataset.index=i;frag.append(div)}root.append(frag);
flip=new St.PageFlip(root,{width:w,height:h,size:'fixed',showCover:true,drawShadow:false,flippingTime:380,mobileScrollSupport:false});
flip.loadFromHTML(root.querySelectorAll('.page'));
flip.on('flip',e=>navigate(e.data));flip.flip(target);navigate(target);
}
function navigate(i){if(!pdf||!flip)return;current=i;$('page').value=i+1;$('prev').disabled=i===0;$('next').disabled=i>=pdf.numPages-1;$('status').textContent='Page '+(i+1)+' / '+pdf.numPages;
const keep=new Set();for(let j=Math.max(0,i-2);j<=Math.min(pdf.numPages-1,i+3);j++)keep.add(j);
for(const [j,c] of rendered){if(!keep.has(j)){c.width=0;c.height=0;c.remove();rendered.delete(j)}}
queue=[i,i+1,i-1,i+2,i+3,i-2].filter(j=>keep.has(j)&&!rendered.has(j));pump(epoch);
}
async function pump(id){if(working)return;working=true;try{while(queue.length&&id===epoch){const i=queue.shift();if(rendered.has(i))continue;const host=$('book').querySelector('[data-index="'+i+'"]');if(!host)continue;const page=await pdf.getPage(i+1);if(id!==epoch)break;const base=page.getViewport({scale:1});const w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22));const scale=w/base.width*Math.min(devicePixelRatio||1,1.25);const vp=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);c.style.width='100%';c.style.height='100%';c.style.objectFit='contain';c.style.transformOrigin='center center';c.style.transform='none';host.style.overflow='hidden';host.replaceChildren(c);rendered.set(i,c);await page.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;page.cleanup()}}catch(e){console.warn('Render error',e)}finally{working=false;if(queue.length&&id===epoch)pump(id)}}
$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();$('page').onchange=()=>flip?.flip(Math.max(0,Math.min(pdf.numPages-1,Number($('page').value)-1)));

let reader=null,readerIndex=0,readerZoom=1,readerMode='zoom',readerSeq=0,readerTask=null;
function readerClose(){readerSeq++;if(readerTask){try{readerTask.cancel()}catch(e){}}readerTask=null;if(reader){reader.remove();reader=null}document.body.style.overflow='';$('full').textContent='Full Screen';zoom=1;if(flip&&readerMode==='zoom')flip.flip(readerIndex)}
function readerMove(d){if(!reader||!pdf)return;readerIndex=Math.max(0,Math.min(pdf.numPages-1,readerIndex+d));readerRender()}
function readerScale(d){if(!reader)return;readerZoom=Math.max(1,Math.min(3,Math.round((readerZoom+d)*100)/100));readerRender()}
async function readerRender(){if(!reader||!pdf)return;const ticket=++readerSeq;const old=readerTask;readerTask=null;if(old){try{old.cancel()}catch(e){}try{await old.promise}catch(e){}}if(ticket!==readerSeq||!reader)return;
const controls=reader;controls.querySelector('#reader-page').textContent=(readerIndex+1)+' / '+pdf.numPages;controls.querySelector('#reader-zoom').textContent=Math.round(readerZoom*100)+'%';controls.querySelector('#reader-prev').disabled=readerIndex===0;controls.querySelector('#reader-next').disabled=readerIndex===pdf.numPages-1;controls.querySelector('#reader-minus').disabled=readerZoom<=1;controls.querySelector('#reader-plus').disabled=readerZoom>=3;
try{const page=await pdf.getPage(readerIndex+1);if(ticket!==readerSeq||reader!==controls)return;const v=page.getViewport({scale:1});const viewportWidth=Math.max(240,window.innerWidth-48);const viewportHeight=Math.max(240,window.innerHeight-135);const baseWidth=readerMode==='full'?Math.min(viewportWidth,viewportHeight*v.width/v.height):Math.min(720,viewportWidth);const cssWidth=baseWidth*readerZoom;const cssHeight=cssWidth*v.height/v.width;const density=Math.min(window.devicePixelRatio||1,1.5);const maxPixels=3500000;const densityLimit=Math.sqrt(maxPixels/(cssWidth*cssHeight));const vp=page.getViewport({scale:cssWidth/v.width*Math.min(density,densityLimit)});const canvas=controls.querySelector('#reader-canvas');canvas.width=Math.max(1,Math.round(vp.width));canvas.height=Math.max(1,Math.round(vp.height));canvas.style.width=Math.round(cssWidth)+'px';canvas.style.height=Math.round(cssHeight)+'px';controls.querySelector('#reader-scroll').scrollTop=0;controls.querySelector('#reader-scroll').scrollLeft=0;const task=page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp});readerTask=task;await task.promise;if(readerTask===task)readerTask=null}catch(e){if(e.name!=='RenderingCancelledException'&&ticket===readerSeq){controls.querySelector('#reader-page').textContent='Page error — try Next';console.warn(e)}}}
function readerOpen(mode,initialDelta=0){if(!pdf)return;if(reader){if(readerMode!==mode){readerMode=mode;readerZoom=mode==='zoom'?1.25:1;readerRender()}else if(initialDelta)readerScale(initialDelta);return}
readerMode=mode;readerIndex=current;readerZoom=mode==='zoom'?Math.max(1,1+initialDelta):1;reader=document.createElement('section');reader.id='fsp-reader';reader.style.cssText='position:fixed;inset:0;z-index:10000;background:#102b30;color:white;display:flex;flex-direction:column';reader.innerHTML='<div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;background:#123e42"><button id="reader-prev">❮ Previous</button><span id="reader-page"></span><button id="reader-next">Next ❯</button><button id="reader-minus">Zoom −</button><span id="reader-zoom"></span><button id="reader-plus">Zoom +</button><button id="reader-close">Close ✕</button></div><div id="reader-scroll" style="flex:1;min-height:0;overflow:auto;padding:16px;overscroll-behavior:contain"><canvas id="reader-canvas" style="display:block;margin:auto;background:white;max-width:none"></canvas></div>';
document.body.append(reader);document.body.style.overflow='hidden';if(mode==='full')$('full').textContent='Exit Full Screen';reader.querySelector('#reader-prev').onclick=()=>readerMove(-1);reader.querySelector('#reader-next').onclick=()=>readerMove(1);reader.querySelector('#reader-minus').onclick=()=>readerScale(-.25);reader.querySelector('#reader-plus').onclick=()=>readerScale(.25);reader.querySelector('#reader-close').onclick=readerClose;readerRender()}
$('zi').onclick=()=>reader?readerScale(.25):readerOpen('zoom',.25);
$('zo').onclick=()=>reader?readerScale(-.25):readerOpen('zoom',0);
$('full').onclick=()=>reader?readerClose():readerOpen('full');
document.addEventListener('keydown',e=>{if(!reader)return;if(e.key==='Escape'){readerClose();return}if(e.key==='ArrowRight'){e.preventDefault();readerMove(1)}if(e.key==='ArrowLeft'){e.preventDefault();readerMove(-1)}});
$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);else prompt('Share:',location.href)}catch(e){}};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf){if(reader)readerRender();else build(current)}},350)});
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p'].includes(e.key.toLowerCase()))e.preventDefault()});load();
</script></body></html>
