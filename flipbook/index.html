<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSP Digital Flipbook | Preview</title>
<style>
:root{font-family:system-ui,"Noto Sans Tamil",sans-serif;color:#173d40;background:#edf3f3}*{box-sizing:border-box}body{margin:0}header{background:#143f43;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header small{display:block;color:#d5e7e5;margin-top:4px}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px;background:white;box-shadow:0 2px 8px #1232}button,a.action{border:1px solid #b8cacc;border-radius:9px;background:#fff;color:#143f43;padding:10px 13px;cursor:pointer;text-decoration:none;font:inherit}button:hover,a.action:hover{background:#e3eeee}button:disabled{opacity:.4;cursor:not-allowed}main{padding:20px 10px;min-height:60vh;display:grid;place-items:center}#book{margin:auto}#book .page{background:white;box-shadow:inset 0 0 12px #0001;overflow:hidden;display:flex;align-items:center;justify-content:center}#book canvas{display:block;width:100%;height:100%;object-fit:contain}.message{padding:45px 20px;text-align:center;max-width:650px;line-height:1.8}footer{text-align:center;padding:20px;color:#547074}input{width:65px;padding:9px;border:1px solid #b8cacc;border-radius:8px}body.full main{min-height:85vh}@media(max-width:600px){header strong{font-size:17px}main{padding:12px 2px}.toolbar{gap:5px}button,a.action{padding:9px}}
</style></head><body><header><div><strong>Future Secure Providers</strong><small>Digital Flipbook · Preview</small></div><span>Professional Reading Experience</span></header>
<nav class="toolbar" aria-label="Book controls"><button id="prev" disabled>❮ Previous</button><span>Page <input id="page" type="number" min="1" value="1" aria-label="Page number"> / <span id="total">0</span></span><button id="next" disabled>Next ❯</button><button id="zoomOut" disabled>− Zoom</button><button id="zoomIn" disabled>+ Zoom</button><button id="full">⛶ Full Screen</button><button id="share">Share</button><a class="action" id="download" href="brochure.pdf" download hidden>Download PDF</a></nav>
<main id="stage"><div id="book"></div><div class="message" id="message">PDF-ஐ திறக்கிறோம்…</div></main>
<footer>Future Secure Providers · Call 9585 905 905, 9363 705 905</footer>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs';
import {PageFlip} from 'https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.module.js';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
const $=id=>document.getElementById(id),book=$('book'),msg=$('message'),stage=$('stage');let pdf,flip,scale=1,pages=[],busy=false;
const url='brochure.pdf';
async function render(){if(!pdf||busy)return;busy=true;try{if(flip){flip.destroy();flip=null}book.replaceChildren();pages=[];const desktop=innerWidth>700;const w=Math.min(desktop?Math.floor((innerWidth-80)/2):innerWidth-28,500);const first=await pdf.getPage(1),v=first.getViewport({scale:1});const h=Math.round(w*v.height/v.width);for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),canvas=document.createElement('canvas'),wrapper=document.createElement('div');wrapper.className='page';const vp=p.getViewport({scale:Math.min(2,devicePixelRatio||1)*w*scale/v.width});canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;wrapper.append(canvas);book.append(wrapper);pages.push(wrapper)}flip=new PageFlip(book,{width:w,height:h,size:'fixed',showCover:true,mobileScrollSupport:false,maxShadowOpacity:.28});flip.loadFromHTML(pages);flip.on('flip',e=>{$('page').value=e.data+1;sync()});$('total').textContent=pdf.numPages;$('page').max=pdf.numPages;msg.hidden=true;sync()}catch(e){msg.hidden=false;msg.textContent='Flipbook render செய்ய முடியவில்லை: '+e.message}finally{busy=false}}
function sync(){const ok=!!flip;$('prev').disabled=!ok||flip.getCurrentPageIndex()===0;$('next').disabled=!ok||flip.getCurrentPageIndex()>=pages.length-1;$('zoomIn').disabled=!ok;$('zoomOut').disabled=!ok}
$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();$('page').onchange=()=>{const n=Number($('page').value);if(flip&&Number.isInteger(n)&&n>=1&&n<=pages.length)flip.flip(n-1)};
$('zoomIn').onclick=()=>{scale=Math.min(2,scale+.25);render()};$('zoomOut').onclick=()=>{scale=Math.max(1,scale-.25);render()};
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.();
$('share').onclick=async()=>{const link=location.href;try{if(navigator.share)await navigator.share({title:document.title,url:link});else if(navigator.clipboard){await navigator.clipboard.writeText(link);alert('Link copied')}else prompt('Copy link:',link)}catch(e){if(e.name!=='AbortError')prompt('Copy link:',link)}};
try{const response=await fetch(url,{method:'HEAD'});if(!response.ok)throw Error('PDF இன்னும் சேர்க்கப்படவில்லை. brochure.pdf upload செய்யவும்.');pdf=await pdfjs.getDocument(url).promise;$('download').hidden=false;await render()}catch(e){msg.textContent='Preview தயாராக உள்ளது. உங்கள் PDF-ஐ flipbook/brochure.pdf என்ற பெயரில் சேர்த்ததும் புத்தகம் இங்கே திறக்கும். ('+e.message+')'}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdf)render()},450)});
</script></body></html>
