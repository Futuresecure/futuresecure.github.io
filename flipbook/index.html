<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP Health Insurance Flipbook</title><style>body{margin:0;background:#edf3f3;color:#143f43;font:16px system-ui}header{background:#143f43;color:white;padding:18px;text-align:center}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:white;padding:12px}button,a{padding:10px;border:1px solid #abc;border-radius:8px;background:white;color:#143f43;text-decoration:none;cursor:pointer}button:disabled{opacity:.4}#status{text-align:center;padding:12px}#book{margin:12px auto}.page{background:white;overflow:hidden}.page canvas{width:100%;height:100%;object-fit:contain}footer{text-align:center;padding:20px}input{width:55px;padding:8px}body{user-select:none;-webkit-user-select:none}canvas{-webkit-user-drag:none}#book,.page{position:relative}#book:after{content:'FUTURE SECURE PROVIDERS • VIEW ONLY';pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,28px);font-weight:700;letter-spacing:2px;color:rgba(20,63,67,.13);transform:rotate(-25deg);z-index:5}body.flipbook-full{position:fixed;inset:0;width:100%;height:100dvh;overflow:auto;z-index:999;background:#edf3f3}body.flipbook-full header{padding:8px}body.flipbook-full nav{position:sticky;top:0;z-index:50}body.flipbook-full #book{margin:10px auto}body.flipbook-full footer{padding:8px}html:fullscreen,html:-webkit-full-screen{background:#edf3f3}</style></head><body><header><strong>FUTURE SECURE PROVIDERS</strong><div>ஹெல்த் இன்சூரன்ஸ் புரிஞ்சுக்கலாம் · Digital Flipbook</div></header><nav><button id="prev">❮ Previous</button><label>Page <input id="page" type="number" value="1" min="1"> / <span id="total">—</span></label><button id="next">Next ❯</button><button id="zi">Zoom +</button><button id="zo">Zoom −</button><button id="full">Full Screen</button><button id="share">Share</button></nav><div id="status">Loading book…</div><main id="book"></main><footer>Future Secure Providers : Call 9585 905 905, 9363 705 905.</footer><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
const $=id=>document.getElementById(id);
let pdf,flip,zoom=1,epoch=0,rendered=new Map(),queue=[],working=false,current=0;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function load(){try{pdf=await pdfjsLib.getDocument({url:'brochure.pdf',disableAutoFetch:true,disableStream:true}).promise;$('total').textContent=pdf.numPages;await build(0)}catch(e){$('status').textContent='Unable to open PDF: '+e.message}}
async function build(target){const id=++epoch;queue=[];rendered.clear();const root=$('book');if(flip){flip.destroy();flip=null}root.replaceChildren();const first=await pdf.getPage(1);if(id!==epoch)return;const size=first.getViewport({scale:1}),w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22)),h=w*size.height/size.width;
const frag=document.createDocumentFragment();for(let i=0;i<pdf.numPages;i++){const div=document.createElement('div');div.className='page';div.dataset.index=i;frag.append(div)}root.append(frag);
flip=new St.PageFlip(root,{width:w,height:h,size:'fixed',showCover:true,drawShadow:false,flippingTime:380,mobileScrollSupport:false});
flip.loadFromHTML(root.querySelectorAll('.page'));
flip.on('flip',e=>navigate(e.data));flip.flip(target);navigate(target);
}
function navigate(i){if(!pdf||!flip)return;current=i;$('page').value=i+1;$('prev').disabled=i===0;$('next').disabled=i>=pdf.numPages-1;$('status').textContent='Page '+(i+1)+' / '+pdf.numPages;
const keep=new Set();for(let j=Math.max(0,i-2);j<=Math.min(pdf.numPages-1,i+3);j++)keep.add(j);
for(const [j,c] of rendered){if(!keep.has(j)){c.width=0;c.height=0;c.remove();rendered.delete(j)}}
queue=[i,i+1,i-1,i+2,i+3,i-2].filter(j=>keep.has(j)&&!rendered.has(j));pump(epoch);
}
async function pump(id){if(working)return;working=true;try{while(queue.length&&id===epoch){const i=queue.shift();if(rendered.has(i))continue;const host=$('book').querySelector('[data-index="'+i+'"]');if(!host)continue;const page=await pdf.getPage(i+1);if(id!==epoch)break;const base=page.getViewport({scale:1});const w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22));const scale=w/base.width*Math.min(devicePixelRatio||1,1.25);const vp=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);c.style.width='100%';c.style.height='100%';c.style.objectFit='contain';c.style.transformOrigin='center center';c.style.transform='none';host.style.overflow='hidden';host.replaceChildren(c);rendered.set(i,c);await page.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;page.cleanup()}}catch(e){console.warn('Render error',e)}finally{working=false;if(queue.length&&id===epoch)pump(id)}}
$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();$('page').onchange=()=>flip?.flip(Math.max(0,Math.min(pdf.numPages-1,Number($('page').value)-1)));
let zoomDialog=null,zoomCanvas=null,zoomPage=0;
async function showZoom(delta){zoom=Math.max(1,Math.min(3,Math.round((zoom+delta)*100)/100));if(!zoomDialog){zoomDialog=document.createElement('div');zoomDialog.id='zoom-overlay';zoomDialog.style.cssText='position:fixed;inset:0;background:rgba(10,24,27,.95);z-index:9999;display:flex;flex-direction:column;color:white';zoomDialog.innerHTML='<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:#123b40"><button id="zminus">−</button><span id="zlabel"></span><button id="zplus">+</button><button id="zclose">Close ✕</button></div><div id="zscroll" style="overflow:auto;flex:1;text-align:center;padding:20px;overscroll-behavior:contain"><canvas id="zcanvas" style="display:block;margin:auto;background:white;max-width:none"></canvas></div>';document.body.append(zoomDialog);zoomDialog.querySelector('#zminus').onclick=()=>showZoom(-.25);zoomDialog.querySelector('#zplus').onclick=()=>showZoom(.25);zoomDialog.querySelector('#zclose').onclick=()=>{zoomDialog.remove();zoomDialog=null;zoomCanvas=null;zoom=1};zoomDialog.onclick=e=>{if(e.target===zoomDialog){zoomDialog.querySelector('#zclose').click()}}}
zoomDialog.querySelector('#zlabel').textContent='Zoom '+Math.round(zoom*100)+'% · Page '+(current+1);
zoomDialog.querySelector('#zminus').disabled=zoom<=1;zoomDialog.querySelector('#zplus').disabled=zoom>=3;
const pageNum=current,request=++zoomPage;const p=await pdf.getPage(pageNum+1);if(request!==zoomPage||!zoomDialog)return;const base=p.getViewport({scale:1});const width=Math.min(750,Math.max(320,innerWidth-40))*zoom;const scale=width/base.width;const vp=p.getViewport({scale:scale*Math.min(devicePixelRatio||1,1.5)});const canvas=zoomDialog.querySelector('#zcanvas');if(zoomCanvas){try{zoomCanvas.cancel()}catch(e){}}canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);canvas.style.width=Math.round(width)+'px';canvas.style.height=Math.round(width*base.height/base.width)+'px';zoomCanvas=p.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp});try{await zoomCanvas.promise}catch(e){if(e.name!=='RenderingCancelledException')console.warn(e)}}
$('zi').onclick=()=>showZoom(zoomDialog && zoomDialog.isConnected ? .25 : 0.25);
$('zo').onclick=()=>showZoom(zoomDialog && zoomDialog.isConnected ? -.25 : 0);
let pseudoFull=false;
function setFullLabel(){const active=!!document.fullscreenElement||pseudoFull;$('full').textContent=active?'Exit Full Screen':'Full Screen';document.body.classList.toggle('flipbook-full',active)}
async function toggleFull(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}pseudoFull=false;setFullLabel();return}if(pseudoFull){pseudoFull=false;setFullLabel();return}try{if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();pseudoFull=false}else{pseudoFull=true}}catch(e){pseudoFull=true}setFullLabel()}
$('full').onclick=toggleFull;document.addEventListener('fullscreenchange',setFullLabel);document.addEventListener('fullscreenerror',()=>{pseudoFull=true;setFullLabel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pseudoFull){pseudoFull=false;setFullLabel()}});

$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);else prompt('Share:',location.href)}catch(e){}};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf)build(current)},350)});
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p'].includes(e.key.toLowerCase()))e.preventDefault()});load();
</script></body></html>
