<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP Health Insurance Flipbook</title><style>body{margin:0;background:#edf3f3;color:#143f43;font:16px system-ui}header{background:#143f43;color:white;padding:18px;text-align:center}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:white;padding:12px}button,a{padding:10px;border:1px solid #abc;border-radius:8px;background:white;color:#143f43;text-decoration:none;cursor:pointer}button:disabled{opacity:.4}#status{text-align:center;padding:12px}#book{margin:12px auto}.page{background:white;overflow:hidden}.page canvas{width:100%;height:100%;object-fit:contain}footer{text-align:center;padding:20px}input{width:55px;padding:8px}</style></head><body><header><strong>FUTURE SECURE PROVIDERS</strong><div>ஹெல்த் இன்சூரன்ஸ் புரிஞ்சுக்கலாம் · Digital Flipbook</div></header><nav><button id="prev">❮ Previous</button><label>Page <input id="page" type="number" value="1" min="1"> / <span id="total">—</span></label><button id="next">Next ❯</button><button id="zi">Zoom +</button><button id="zo">Zoom −</button><button id="full">Full Screen</button><button id="share">Share</button><a href="brochure.pdf" download>Download PDF</a></nav><div id="status">Loading book…</div><main id="book"></main><footer>Future Secure Providers : Call 9585 905 905, 9363 705 905.</footer><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
const $=id=>document.getElementById(id);
let pdf,flip,zoom=1,epoch=0,rendered=new Map(),queue=[],working=false,current=0;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function load(){try{pdf=await pdfjsLib.getDocument({url:'brochure.pdf',disableAutoFetch:true,disableStream:true}).promise;$('total').textContent=pdf.numPages;await build(0)}catch(e){$('status').textContent='Unable to open PDF: '+e.message}}
async function build(target){const id=++epoch;queue=[];rendered.clear();const root=$('book');if(flip){flip.destroy();flip=null}root.replaceChildren();const first=await pdf.getPage(1);if(id!==epoch)return;const size=first.getViewport({scale:1}),w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22)),h=w*size.height/size.width;
const frag=document.createDocumentFragment();for(let i=0;i<pdf.numPages;i++){const div=document.createElement('div');div.className='page';div.dataset.index=i;frag.append(div)}root.append(frag);
flip=new St.PageFlip(root,{width:w,height:h,size:'fixed',showCover:true,drawShadow:false,flippingTime:380,mobileScrollSupport:false});
flip.loadFromHTML(root.querySelectorAll('.page'));
flip.on('flip',e=>navigate(e.data));flip.flip(target);navigate(target);
}
function navigate(i){if(!pdf||!flip)return;current=i;$('page').value=i+1;$('prev').disabled=i===0;$('next').disabled=i>=pdf.numPages-1;$('status').textContent='Page '+(i+1)+' / '+pdf.numPages;
const keep=new Set();for(let j=Math.max(0,i-2);j<=Math.min(pdf.numPages-1,i+3);j++)keep.add(j);
for(const [j,c] of rendered){if(!keep.has(j)){c.width=0;c.height=0;c.remove();rendered.delete(j)}}
queue=[i,i+1,i-1,i+2,i+3,i-2].filter(j=>keep.has(j)&&!rendered.has(j));pump(epoch);
}
async function pump(id){if(working)return;working=true;try{while(queue.length&&id===epoch){const i=queue.shift();if(rendered.has(i))continue;const host=$('book').querySelector('[data-index="'+i+'"]');if(!host)continue;const page=await pdf.getPage(i+1);if(id!==epoch)break;const base=page.getViewport({scale:1});const w=Math.min(460,Math.max(160,innerWidth>720?(innerWidth-60)/2:innerWidth-22));const scale=w/base.width*Math.min(devicePixelRatio||1,1.25);const vp=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);c.style.width='100%';c.style.height='100%';c.style.objectFit='contain';c.style.transformOrigin='center center';c.style.transform='scale('+zoom+')';host.style.overflow='hidden';host.replaceChildren(c);rendered.set(i,c);await page.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;page.cleanup()}}catch(e){console.warn('Render error',e)}finally{working=false;if(queue.length&&id===epoch)pump(id)}}
$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();$('page').onchange=()=>flip?.flip(Math.max(0,Math.min(pdf.numPages-1,Number($('page').value)-1)));
function changeZoom(delta){zoom=Math.max(1,Math.min(2.5,Math.round((zoom+delta)*100)/100));for(const c of rendered.values()){c.style.transform='scale('+zoom+')'}$('zi').disabled=zoom>=2.5;$('zo').disabled=zoom<=1;$('status').textContent='Page '+(current+1)+' / '+pdf.numPages+' · Zoom '+Math.round(zoom*100)+'%'}
$('zi').onclick=()=>changeZoom(.25);$('zo').onclick=()=>changeZoom(-.25);
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);else prompt('Share:',location.href)}catch(e){}};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf)build(current)},350)});
load();
</script></body></html>
